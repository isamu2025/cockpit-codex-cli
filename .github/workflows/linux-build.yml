name: linux-build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build release binary
        run: cargo build --release --bin cockpit-codex --target ${{ matrix.target }}
      - name: Package artifact
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/cockpit-codex dist/cockpit-codex
          cp README.md dist/README.md
          chmod +x dist/cockpit-codex
          tar -C dist -czf cockpit-codex-linux-${{ matrix.arch }}.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: cockpit-codex-linux-${{ matrix.arch }}
          path: cockpit-codex-linux-${{ matrix.arch }}.tar.gz
