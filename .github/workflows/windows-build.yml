name: windows-build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release --bin cockpit-codex
      - name: Package artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\cockpit-codex.exe dist\cockpit-codex.exe
          Copy-Item README.md dist\README.md
          Compress-Archive -Path dist\* -DestinationPath cockpit-codex-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: cockpit-codex-windows-x64
          path: cockpit-codex-windows-x64.zip
