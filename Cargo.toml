[workspace]
members = [
    "crates/codex-gateway-core",
    "crates/cockpit-codex-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "CC-BY-NC-SA-4.0"
authors = ["jlcodes contributors"]

[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.7", features = ["multipart"] }
base64 = "0.22"
bytes = "1.6"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "5.0"
futures-util = "0.3"
http = "1.1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "brotli", "deflate", "zstd", "stream", "socks", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.10"
thiserror = "2.0"
tokio = { version = "1.38", features = ["full"] }
tokio-stream = "0.1"
toml = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
